<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e5a44">
<meta name="description" content="Licensed moneylender. Choose your amount, period and repayment schedule, and see the full cost before you apply.">
<title>Loans</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
body{background:#e9e4d8}
.shell{max-width:480px;margin:0 auto;min-height:100dvh;background:#f7f4ec;display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line)}
.apphead{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:#f7f4ec}
.apphead .logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.iconbtn{position:relative;background:var(--card);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line)}
.iconbtn i{position:absolute;top:-3px;right:-3px;background:var(--danger);color:#fff;font-style:normal;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:99px;display:grid;place-items:center;padding:0 4px}
main{flex:1;padding:0 16px 110px}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:20;display:flex;border-top:1px solid var(--line);background:var(--card);padding:8px 8px max(12px,env(safe-area-inset-bottom))}
.tabbar button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--faint)}
.tabbar button.on{color:var(--brand)}
.hero{background:var(--brand);color:#fff;border-radius:18px;padding:18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero .lic{font-size:11px;opacity:.8;font-weight:600}
.hero h2{font-size:22px;margin:6px 0 4px;line-height:1.2}
.hero p{margin:0;opacity:.85;font-size:12.5px}
.sec{margin-top:16px}
.lbl{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px}
input[type=range]{width:100%;accent-color:var(--brand)}
.qbox{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.qbig{font-size:28px;font-weight:800;letter-spacing:-.02em}
.qline{display:flex;justify-content:space-between;padding:6px 0;border-top:1px dashed var(--line);font-size:13px;gap:12px}
.qline:first-of-type{border-top:0}
.sched{margin-top:8px;font-size:12.5px}
.sched div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f0ebdf;gap:8px}
.loancard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.msg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.msg.unread{border-color:var(--brand2);box-shadow:inset 3px 0 0 var(--brand2)}
.chip{padding:9px 14px}
.seg button{padding:10px 6px;font-size:13px}
.in{font-size:16px}
.pin{letter-spacing:.5em;font-family:var(--mono);font-size:20px;text-align:center}
.banner{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}
</style>
</head>
<body>
<div class="shell">
  <header class="apphead">
    <div class="logo"><img src="/icons/icon-192.png" width="28" height="28" alt="" style="border-radius:8px"><span id="coName"></span></div>
    <button class="iconbtn" onclick="go('inbox')" aria-label="Notifications"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/></svg><span id="unread"></span></button>
  </header>
  <main id="view"><div class="loading"><span class="spin"></span></div></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div id="toast"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
